[project]
name = "smart-hospital-office-it-platform"
version = "0.1.0"
description = "Enterprise LAN monitoring, printer management, inventory, and remote IT support desktop SaaS platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.1,<4.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "email-validator>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "packaging>=24.1",
    "psutil>=6.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "PyJWT>=2.9.0",
    "PySide6>=6.7.2",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "reportlab>=4.2.2",
    "SQLAlchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
    "websockets>=13.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "wmi>=1.5.1",
]
network = [
    "python-nmap>=0.7.1",
    "pysnmp>=7.1.0",
    "scapy>=2.5.0",
]
packaging = [
    "nuitka>=2.4.8",
    "pyinstaller>=6.10.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
